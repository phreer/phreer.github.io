---
layout: default
---

<article class="page-article{% if page.feature-img %} feature-image{% endif %}">
  <header id="main" class="article-header"{% if page.feature-img %} style="background-image: url('{{ page.feature-img | relative_url }}')"{% endif %}>
    <h1 id="{{ page.title | default: "" | cgi_escape }}" class="title">
        {{ page.title }}
    </h1>
    
    {% if page.subtitle %}
    <h2 class="subtitle">{{ page.subtitle }}</h2>
    {% endif %}
      
  </header>
  <section class="post-content">{{ content }}</section>
    
    
  <!-- Tag list for portfolio -->
  {% if page.tags.size > 0 %}
  <footer class="post-tag">
  {% capture tag_list %}
  {{ page.tags | join: "|"}}
  {% endcapture %}
  {% include tags_list.html tags=tag_list %}
  </footer>
  {% endif %}
    
</article>
