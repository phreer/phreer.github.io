---
layout: page
---
<div class="archives">
  {% assign years = site.posts | group_by_exp: 'post', 'post.date | date: "%Y"' %}
  {% for year in years %}
  <section class="archive-year" aria-label="{{ year.name }}">
    <h2>{{ year.name }}</h2>
    <ul class="archive-list">
      {% for post in year.items %}
      <li class="archive-entry">
        <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
        <time class="meta" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%m.%d" }}</time>
      </li>
      {% endfor %}
    </ul>
  </section>
  {% endfor %}
</div>
