---
layout: page
---

{% assign years = site.posts | group_by_exp: "post", "post.date | date: '%Y'" %}
<div class="archives">
  {% for year in years %}
  <section class="year-group">
    <h2 class="year">{{ year.name }}</h2>
    <ul class="post-list">
      {% for post in year.items %}
      {% include post_item.html url=post.url title=post.title date=post.date format="%m-%d" %}
      {% endfor %}
    </ul>
  </section>
  {% endfor %}
</div>
