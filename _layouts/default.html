<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' | escape }}">

  <body class="layout-{{ page.layout | slugify }}">
    <a class="skip-link" href="#content">{{ site.theme_settings.str_skip_content }}</a>
    {% include navbar.html %}
    <main id="content" class="content" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
