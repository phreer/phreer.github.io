---
layout: page
---

<input type="text" id="search-input" class="search-bar" autocomplete="off" enterkeyhint="search"
       placeholder="{{ site.theme_settings.str_search_placeholder | default: '输入关键词…' }}"
       aria-label="{{ site.theme_settings.str_search | default: '搜索' }}">
<ul id="results-container" class="post-list search-results"></ul>

<script src="{{ '/assets/js/simple-jekyll-search.min.js' | relative_url }}"></script>
<script>
  SimpleJekyllSearch({
    searchInput: document.getElementById('search-input'),
    resultsContainer: document.getElementById('results-container'),
    json: [
      {% if site.theme_settings.search %}
      {% for post in site.posts %}
      {
        "title": {{ post.title | escape | jsonify }},
        "category": {{ post.category | default: "" | escape | jsonify }},
        "tags": {{ post.tags | join: ", " | escape | jsonify }},
        "url": {{ post.url | relative_url | jsonify }},
        "date": {{ post.date | date: "%Y-%m-%d" | jsonify }},
        "content": {{ post.content | strip_html | strip_newlines | jsonify }}
      },
      {% endfor %}
      {% for note in site.portfolio %}
      {% if note.title %}
      {
        "title": {{ note.title | escape | jsonify }},
        "category": {{ note.category | default: "" | escape | jsonify }},
        "tags": {{ note.tags | join: ", " | escape | jsonify }},
        "url": {{ note.url | relative_url | jsonify }},
        "date": {{ note.date | date: "%Y-%m-%d" | jsonify }},
        "content": {{ note.content | strip_html | strip_newlines | jsonify }}
      },
      {% endif %}
      {% endfor %}
      {% endif %}
    ],
    searchResultTemplate: '<li class="post-item"><time>{date}</time><a href="{url}">{title}</a></li>',
    noResultsText: '<li class="search-empty">{{ site.theme_settings.str_search_no_results | default: "没有找到相关文章" }}</li>',
    limit: 10,
    fuzzy: true,
    exclude: []
  })
</script>
