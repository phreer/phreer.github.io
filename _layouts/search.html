---
layout: page
---
<label class="sr-only" for="search-input">{{ site.theme_settings.str_search }}</label>
<input type="search" id="search-input" placeholder="{{ site.theme_settings.str_search_placeholder }}" class="search-bar" autocomplete="off">
<ul id="results-container" class="search-results" aria-live="polite"></ul>
<script src="{{ '/assets/js/simple-jekyll-search.min.js' | relative_url }}"></script>
<script>
  SimpleJekyllSearch({
    searchInput: document.getElementById('search-input'),
    resultsContainer: document.getElementById('results-container'),
    json: [
      {% if site.theme_settings.search %}
      {% assign search_documents = site.posts | concat: site.portfolio %}
      {% for document in search_documents %}
      {
        "title": {{ document.title | escape | jsonify }},
        "category": {{ document.category | default: '' | escape | jsonify }},
        "tags": {{ document.tags | join: ', ' | escape | jsonify }},
        "url": {{ document.url | relative_url | jsonify }},
        "date": {{ document.date | date: "%Y.%m.%d" | jsonify }},
        "content": {{ document.content | strip_html | strip_newlines | jsonify }}
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
      {% endif %}
    ],
    searchResultTemplate: '<li class="search-title"><h2><a href="{url}">{title}</a></h2><p class="meta">{date}<span class="search-tags">{tags}</span></p></li>',
    noResultsText: {{ site.theme_settings.str_search_empty | jsonify }},
    limit: 10,
    fuzzy: true,
    exclude: []
  });
</script>
