{% comment %} Parameter: tags, an array of tag names. {% endcomment %}
{% assign tag_items = include.tags | uniq %}
{% if tag_items.size > 0 %}
<ul class="post-tags">
  {% for tag in tag_items %}
  <li><a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a></li>
  {% endfor %}
</ul>
{% endif %}
