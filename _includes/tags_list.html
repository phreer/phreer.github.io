{% assign tags = include.tags | strip | split: '|' | sort | uniq %}
{% if tags.size > 0 %}
<div class="tag-list" aria-label="{{ site.theme_settings.str_tags }}">
  {% for tag in tags %}
  {% if tag != empty %}
  <a class="tag-link" href="{{ '/tags/' | relative_url }}#{{ tag | cgi_escape }}"><span aria-hidden="true"># </span>{{ tag | escape }}</a>
  {% endif %}
  {% endfor %}
</div>
{% endif %}
